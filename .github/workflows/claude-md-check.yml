name: claude-md-check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (a) 200줄 초과면 실패. 판정은 scripts/check-claude-md.py 한 곳.
      - name: CLAUDE.md 줄 수
        run: python3 scripts/check-claude-md.py --lines-only

      # (b) 컨벤션 파일만 바뀌고 CLAUDE.md 는 안 바뀌면 PR 에 코멘트(실패시키지 않음, 중복 방지).
      #     fork PR 은 토큰이 읽기 전용이라 코멘트가 막힐 수 있어 continue-on-error.
      - name: 컨벤션 변경 대비 CLAUDE.md 변경 확인
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- claude-md-drift -->'
          rc=0
          gh pr diff "$PR" --repo "$REPO" --name-only | python3 scripts/check-claude-md.py --drift || rc=$?
          [ "$rc" -eq 3 ] || exit 0
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            echo "이미 코멘트함"; exit 0
          fi
          body="$marker"$'\n'"docs/·templates/ 등 컨벤션 파일이 바뀌었는데 \`CLAUDE.md\` 변경이 없습니다. \`CLAUDE.md\` 갱신이 필요한지 확인해 주세요. 필요 없으면 무시해도 됩니다(체크 실패 아님)."
          gh pr comment "$PR" --repo "$REPO" --body "$body"
